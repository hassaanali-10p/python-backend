[project]
name = "identity-service"
version = "0.1.0"
description = "Authentication provider: registration, login, JWT issuance (RS256), RBAC."
requires-python = ">=3.11,<4.0"
dependencies = [
    # Web framework
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30)",
    # Configuration
    "pydantic-settings (>=2.4)",
    # Email validation for Pydantic EmailStr
    "email-validator (>=2.2)",
    # Database: async SQLAlchemy + Postgres driver + migrations
    "sqlalchemy[asyncio] (>=2.0.30)",
    "asyncpg (>=0.29)",
    "alembic (>=1.13)",
    # Auth: RS256 JWT signing + Argon2 password hashing
    "pyjwt[crypto] (>=2.9)",
    "cryptography (>=43)",
    "pwdlib[argon2] (>=0.2)",
    # OAuth2 password form parsing
    "python-multipart (>=0.0.9)",
    "slowapi (>=0.1.9,<0.2.0)",
]

[tool.poetry]
# Applications, not libraries: don't try to build/install this project itself.
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
